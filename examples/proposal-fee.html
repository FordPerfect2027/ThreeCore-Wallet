<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>費用と上限を照合 — ThreeCore</title><link rel="stylesheet" href="/examples/operation-rehearsal.css">
</head><body><main><header><a href="/proposals/allowance/" target="_blank" rel="noopener">許可額の確認を別タブで開く</a>
<h1>費用と上限を照合</h1><p>提案の検証用データと費用の記録を照合します。設定した予算はそのまま維持し、未確認の費用をゼロ扱いしません。</p>
<p>保存資料の確認専用です。この画面は費用の新規取得や取引を行いません。資料に書かれた取得元の本人確認や、現在の実行可否を保証するものではありません。</p></header>
<section><h2>1. 資料を開く</h2><label>費用の保存記録1個、または検証用データと費用記録の2個 <input id="fee-files" type="file" multiple accept=".json,application/json"></label>
<p id="fee-status" role="status">資料を選んでください。</p><div id="fee-preview" hidden><p id="fee-context"></p></div></section>
<section><h2>2. 再照合</h2><label>費用取得から許容する時間（秒、1〜600） <input id="fee-age" type="text" inputmode="numeric" value="60"></label>
<p>元の提案や見積もりの期限は延長しません。現在の時刻による再照合でも、チェーンの最新状態は取得しません。</p>
<button id="fee-check" type="button" disabled>現在の時刻で再照合</button><button id="fee-cancel" type="button">取り消す</button></section>
<section id="fee-result" hidden><h2 id="fee-period">確認結果</h2><p id="fee-outcome"></p><p id="fee-environment"></p><p id="fee-execution"></p><p id="fee-extra"></p><p id="fee-total"></p><p id="fee-budget"></p><p id="fee-time"></p><ul id="fee-reasons"></ul></section>
<button id="fee-save" type="button" disabled>元の資料と結果を1ファイルに保存</button><p id="fee-save-status" role="status"></p>
</main><script type="module" src="/examples/proposal-fee-page.js"></script></body></html>
