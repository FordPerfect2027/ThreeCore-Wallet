<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreeCore Wallet — Read-only Demo</title>
<style>
:root{font:16px/1.5 system-ui;color:#edf2ff;background:#0a1020}
body{max-width:1060px;margin:auto;padding:28px 18px}
header{margin-bottom:25px}h1{margin-bottom:0}
small,p{color:#c7d1e3}
.notice{background:#1b2940;border:1px solid #7283a3;padding:12px 16px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{padding:18px;border-radius:15px;background:#172139;border:1px solid #405275}
.card:nth-child(1){border-top:4px solid #e5b84d}
.card:nth-child(2){border-top:4px solid #e890b3}
.card:nth-child(3){border-top:4px solid #9fb5c7}
label{display:block;font-weight:600;margin-top:13px}
input,select{display:block;box-sizing:border-box;width:100%;padding:9px;margin-top:5px;color:#fff;background:#0b1426;border:1px solid #8292af;border-radius:8px}
button{padding:10px;margin:12px 4px 0 0;border:none;border-radius:8px;cursor:pointer;background:#6dbde9;color:#061b2a;font-weight:700}
button.secondary{background:#485d7d;color:white}
button:disabled{opacity:.5;cursor:default}
output{display:block;min-height:60px;word-wrap:break-word;white-space:pre-wrap;margin-top:15px;color:#9fe0ff}
.portfolio-panel{border-top:1px solid #8292af;margin-top:20px;padding-top:10px}
.portfolio-panel textarea{display:block;box-sizing:border-box;width:100%;background:#0b1426;color:#fff;border:1px solid #8292af;padding:10px;border-radius:8px;resize:vertical}
.portfolio-details,.comparison-details,.token-plan-details,.history-details,.history-preview-details,.history-filter-results,.history-review-details,.history-recovery-details{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.comparison-panel,.token-plan-panel,.history-panel{border-top:1px solid #8292af;margin-top:18px;padding-top:8px}
.portfolio-panel button:focus-visible,.portfolio-panel textarea:focus-visible{outline:3px solid #ffd369;outline-offset:3px}
.history-list{padding-left:20px;overflow-wrap:anywhere;font-size:12px}.history-panel input[type=checkbox]{display:inline-block;width:auto;margin:6px}.history-panel select{font-size:12px}
.wallet-setup-panel{border:1px solid #7283a3;border-radius:14px;padding:18px;margin-bottom:24px;background:#172139}
.wallet-setup-panel textarea{box-sizing:border-box;width:100%;background:#0b1426;color:#fff;border:1px solid #8292af;border-radius:8px;padding:12px}
.wallet-setup-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.wallet-setup-panel input[type=checkbox]{display:inline-block;width:auto;margin:6px}
.wallet-setup-panel button:focus-visible,.wallet-setup-panel input:focus-visible,.wallet-setup-panel textarea:focus-visible{outline:3px solid #ffd369;outline-offset:3px}
.workspace-panel {margin:1.5rem 0;padding:1.25rem;border:1px solid #64748b;border-radius:14px;background:#172139;}
.workspace-panel textarea {width:100%;max-width:100%;box-sizing:border-box;}
.workspace-panel pre {white-space:pre-wrap;overflow-wrap:anywhere;max-height:36rem;overflow:auto;}
.workspace-panel input[type=checkbox] {width:auto;margin-left:.6rem;}
.workspace-panel :focus-visible {outline:2px solid #67d5f0;outline-offset:3px;}
.checkpoint-panel{margin:1.5rem 0;padding:1.25rem;border:1px solid #69a4bc;border-radius:14px;background:#152638}
.checkpoint-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:30rem;overflow:auto}
.checkpoint-panel input[type=checkbox]{display:inline-block;width:auto;margin:6px}
.checkpoint-panel :focus-visible{outline:3px solid #ffd369;outline-offset:3px}
.transfer-vault-host{max-width:1280px;margin:24px auto;padding:0 20px}
.transfer-vault-panel{background:#111c32;border:1px solid #405275;border-radius:14px;padding:22px}
.transfer-vault-panel pre,.transfer-vault-panel li{white-space:pre-wrap;overflow-wrap:anywhere}
.transfer-vault-panel label{display:block;margin:10px 0}
.transfer-vault-panel input,.transfer-vault-panel select{max-width:100%;box-sizing:border-box}
.transfer-vault-panel input[type=checkbox]{width:auto;margin:0 8px}
.transfer-vault-panel details{border-top:1px solid #405275;margin-top:18px;padding-top:14px}
.transfer-vault-panel summary{cursor:pointer;font-weight:700}
.transfer-vault-panel button{margin:5px 5px 5px 0}
.transfer-vault-panel .transfer-vault-review{border-left:3px solid #ffd369;padding-left:12px}
.transfer-vault-panel .transfer-vault-status{color:#a4eddd}
.transfer-vault-panel .transfer-vault-row{border-bottom:1px solid #405275;padding:10px 0}
.transfer-vault-panel :focus-visible{outline:3px solid #ffd369;outline-offset:3px}
.transfer-vault-panel [hidden]{display:none!important}
</style>
<style>
.allowance-panel{border-top:2px solid #6dbde9;margin-top:24px;padding-top:12px}
.allowance-panel textarea{box-sizing:border-box;width:100%;padding:12px;background:#0b1426;color:#fff;border:1px solid #8292af;border-radius:8px;resize:vertical}
.allowance-panel pre,.allowance-overview pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.allowance-overview{padding:18px;margin:20px 0;background:#172139;border:1px solid #405275;border-radius:14px}
.allowance-panel :focus-visible{outline:3px solid #ffd369;outline-offset:3px}
.allowance-panel .allowance-details{max-height:36rem;overflow:auto}
</style>
<style>
.identity-panel{border-top:1px solid #69a4bc;margin-top:20px;padding-top:12px}
.identity-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:32rem;overflow:auto}
.identity-panel input[type=file]{font-size:12px}
.identity-panel :focus-visible{outline:3px solid #ffd369;outline-offset:3px}
.identity-status{color:#bfe7ff;font-weight:600}
.identity-baseline-status{font-size:12px;overflow-wrap:anywhere}
.identity-overview{margin:24px 0;padding:20px;border:1px solid #69a4bc;border-radius:14px;background:#152638}
.identity-overview pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
</style>
<style>
.transfer-panel{border-top:2px solid #75d7c3;margin-top:24px;padding-top:12px;min-width:0}
.transfer-panel pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.transfer-panel .transfer-summary{padding:12px;background:#0b1426;border-radius:8px}
.transfer-panel .transfer-rows{padding-left:20px;max-height:38rem;overflow:auto}
.transfer-panel .transfer-row{padding:12px 0;border-bottom:1px solid #405275;overflow-wrap:anywhere}
.transfer-panel .transfer-row-heading{color:#a4eddd}
.transfer-panel .transfer-counter{display:inline-block;font-size:12px;padding:6px}
.transfer-panel .transfer-status{color:#a4eddd;font-weight:600}
.transfer-panel details{margin-top:16px;border:1px solid #405275;border-radius:8px;padding:12px}
.transfer-panel summary{cursor:pointer;font-weight:700}
.transfer-panel :focus-visible{outline:3px solid #ffd369;outline-offset:3px}
.transfer-panel input[type=file]{font-size:12px}
.transfer-panel .transfer-preview{border-left:3px solid #ffd369;padding-left:10px}
</style>
</head>
<body>
<header>
<h1>ThreeCore Wallet <span aria-hidden="true">👽</span></h1>
<p>DAT • EMA • CAWELON — Ford Prefect</p>
<p class="notice"><strong>開発用デモ・読み取り専用。</strong> Walletの接続、残高・承認額・送受信履歴などの読み取りに対応。署名・送金・スワップ・ブリッジは実装していません。外部の分散型サービスへの接続実績を示すものではありません。秘密鍵やシードフレーズを入力しないでください。</p>
</header>
<main class="grid" id="grid"></main>
<footer><p>各エージェントには別々のEVM公開アドレスを設定してください。接続時にWallet拡張の許可確認が必要です。残高表示は最小単位です。</p>DON'T PANIC. JUST CODE.</footer>
<script type="module">
import { mountWalletDemo } from "/examples/wallet-demo.js";
const start = () => mountWalletDemo({
  document, eventTarget: window, siteOrigin: window.location.origin,
  getLegacyProvider: () => window.ethereum,
});
let app = start();
window.addEventListener("pagehide", () => { app?.dispose(); app = null; });
window.addEventListener("pageshow", () => { if (!app) app = start(); });
</script>
</body>
</html>
