<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
<title>ThreeCore 接続・保存・再読込の通し確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f6;color:#16303b;font:16px/1.6 system-ui}
header,main,details{max-width:1120px;margin:auto;padding:24px}h1{line-height:1.3;margin:10px 0}
.eyebrow{letter-spacing:.15em;font-size:12px}button{font:inherit;padding:10px 15px;margin:5px;border:1px solid #427787;border-radius:8px;background:white;color:#16303b;cursor:pointer}
button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #efb55d;outline-offset:3px}
.notice{border-left:4px solid #36778a;padding:12px;background:#dfedf1}.steps{padding:20px;background:#102e3a;color:white;border-radius:15px}
#overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}article{padding:18px;background:white;border:1px solid #ccdce2;border-radius:12px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}article h2{margin:0 0 8px}.result{padding:18px;background:#dfedf1;border-radius:10px}
#full-app{padding-top:20px}#full-app section{border:1px solid #b8ccd3;padding:16px;margin:12px 0}input,select,textarea{max-width:100%;font:inherit}label{display:block;margin:6px 0}
[hidden]{display:none!important}@media(max-width:700px){#overview{grid-template-columns:1fr}header,main,details{padding:16px}}
</style>
<header><p class="eyebrow">THREECORE / LOCAL END-TO-END CHECK</p>
<h1>接続から、保存・開き直しまで。</h1>
<p>3つの別アドレスで確認した履歴を保存し、ページを開き直して復元します。</p>
<p class="notice">検証専用の3ウォレットと架空の残高を使用します。実ウォレットや既存の保存データへアクセスしません。</p></header>
<main>
<div class="steps"><strong>1 接続と読取り → 2 保存 → ページを再読み込み → 3 内容確認 → 4 復元</strong><br>
<button id="observe">1. 3ウォレットを接続して履歴を作る</button>
<button id="save">2. このブラウザーに控えを保存</button>
<button id="stage">3. 保存した控えの内容を確認</button>
<button id="restore" disabled>4. 確認した内容を復元</button>
<button id="stop">3ウォレットの接続を停止</button></div>
<div id="overview"></div>
<p id="status" class="result" role="status">初期表示では、ウォレット接続も保存データの読み込みも行いません。</p>
<pre id="review"></pre><p id="counts"></p>
</main>
<details><summary>通常アプリの操作パネルを見る</summary><div id="full-app"><div id="grid"></div></div></details>
<script type="module" src="/test/browser/acceptance-demo.js"></script>
</html>
