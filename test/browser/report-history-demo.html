<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ThreeCore — PC内の報告履歴</title>
  <link rel="stylesheet" href="/examples/period-report.css">
  <link rel="stylesheet" href="/examples/report-history.css">
  <style>
    body { margin:0; background:#06131e; color:#eaf7ff; font:16px/1.65 system-ui,sans-serif; }
    main { max-width:1280px; margin:auto; padding:24px; }
    header { padding:20px 0; }
    h1 { font-size:clamp(28px,4vw,42px); line-height:1.3; }
    header p { color:#b8d0df; }
    .eyebrow { color:#6ee3bf; letter-spacing:.14em; font-size:12px; }
    .preview { border:1px solid #7e7746; background:#282820; padding:15px; border-radius:12px; color:#f6e5b1; }
    .demo-actions { display:flex; flex-wrap:wrap; gap:12px; }
    .demo-actions button { padding:12px 16px; color:white; background:#215166; border:1px solid #74a6ba; border-radius:9px; font:inherit; cursor:pointer; }
    @media(max-width:760px) { main { padding:12px; } .demo-actions button { width:100%; } }
  </style>
</head>
<body><main>
  <header>
    <p class="eyebrow">THREECORE / LOCAL DEVELOPMENT PREVIEW</p>
    <h1>確認した報告を残す。<br>必要なときに、比較して開く。</h1>
    <p class="preview">すべて模擬データです。実際の資産ではありません。ウォレット接続・署名・送金は行いません。</p>
    <p>DAT・EMA・CAWELONの計算一致、ハッシュ不一致、取得途中、非表示保管を含む4件の報告で操作を確認できます。日時も検証用です。</p>
    <div class="demo-actions">
      <button id="seed" type="button">プレビュー用の模擬報告4件を用意</button>
      <button id="prepare" type="button">新しい模擬レポートの候補を用意</button>
    </div>
    <p id="demo-message" role="status" aria-live="polite">ボタンを押したときだけ、このプレビュー専用の保存先へ模擬報告を追加します。</p>
    <p>履歴はこのブラウザー・このURLで保存されます。別の端末やポートへ渡すときは、全報告のバックアップJSONを使ってください。</p>
  </header>
  <div id="report-area"></div>
  <div id="history-area"></div>
</main><script type="module" src="/test/browser/report-history-demo.js"></script></body>
</html>
