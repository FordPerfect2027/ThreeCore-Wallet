<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ThreeCore — 3トークンの期間レポート</title>
  <link rel="stylesheet" href="/examples/period-report.css">
  <style>
    body { margin:0; background:#07111e; color:#edf6ff; font:16px/1.7 system-ui,sans-serif; }
    main { max-width:1320px; margin:auto; padding:24px; }
    h1 { font-size:clamp(26px,4vw,42px); line-height:1.3; }
    header p { color:#b3c9dc; }
    .preview-banner { padding:16px; background:#30271b; border:1px solid #97743a; border-radius:12px; color:#f9dfa5; }
    #seed { padding:12px 16px; background:#194967; border:1px solid #6fa9c8; color:white; border-radius:9px; font:inherit; cursor:pointer; }
    #demo-message { min-height:28px; }
    @media(max-width:780px) { main { padding:12px; } }
  </style>
</head>
<body><main>
  <header>
    <p>THREECORE / LOCAL DEVELOPMENT PREVIEW</p>
    <h1>DAT・EMA・CAWELON<br>保存した期間を、並べて確かめる。</h1>
    <p class="preview-banner">すべて模擬データです。実際の残高ではありません。ウォレット接続・署名・送金は行いません。</p>
    <p>3トークンの取得済みの控えと、差額があるEMA・取得途中のCAWELONを用意しています。同じブロック30〜42の記録を選んで比較できます。</p>
    <button id="seed" type="button">プレビュー専用の模擬の控え5件を用意</button>
    <p id="demo-message" role="status" aria-live="polite">ボタンを押したときだけ、このプレビュー専用のPC内保存へ追加します。</p>
    <p>その後「報告用に保存一覧を読み込む」を押してください。JSONを保存して再読込み、HTMLを開いて印刷用表示も確認できます。</p>
  </header>
  <div id="report-area"></div>
</main><script type="module" src="/test/browser/period-report-demo.js"></script></body>
</html>
