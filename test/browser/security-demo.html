<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreeCore Wallet — 接続保護の動作確認</title>
<link rel="stylesheet" href="/examples/security.css">
<style>
:root{font:16px/1.6 system-ui;background:#091b27;color:#e8f4f8}body{max-width:1080px;margin:auto;padding:24px}
h1{font-size:27px}p{color:#c3dce5}.notice{padding:16px;border:1px solid #6bc7c0;background:#13383e;border-radius:12px}
button{font:inherit;padding:10px 14px;border:1px solid #8ddcd7;border-radius:8px;background:#85d7cf;color:#05242a;cursor:pointer;margin:6px 4px 0 0}
button:disabled{opacity:.45;cursor:default}select{font:inherit;background:#0b1d2a;color:#fff;padding:8px;border-radius:8px}
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{padding:18px;border:1px solid #3e697c;border-radius:12px;background:#112d3c}
.card output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin:12px 0;min-height:90px}.card h2{margin-top:0}
#calls{overflow-wrap:anywhere;font-size:13px}label{display:block;margin:10px 0}a{color:#94e5dd}
@media(max-width:650px){body{padding:12px}#cards{grid-template-columns:1fr}h1{font-size:23px}}
</style>
<h1>ThreeCore Wallet — 接続を守る</h1>
<p class="notice">動作確認用の架空Walletです。実際のWallet・資産・外部通信は使用しません。DAT・EMA・CAWELONの接続停止と再開を試せます。</p>
<main id="protection"></main>
<div id="cards"></div>
<p id="calls" role="status">模擬Walletへの要求: 0件</p>
<p>本体にも同じ保護機能を組み込んでいます。停止しても保存履歴は削除しません。</p>
<script type="module" src="/test/browser/security-demo.js"></script>
</html>
