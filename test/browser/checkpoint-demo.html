<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
<title>ThreeCore 保存・再読み込み検証用画面</title>
<style>
body{margin:0;background:#0a1020;color:#eef3ff;font:16px/1.6 system-ui}
header,footer{padding:1.5rem 2rem;background:#101d34}
h1,h2,h3{line-height:1.3}
.notice{padding:1rem;background:#203b58;border-left:4px solid #6ad8ff}
#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:1rem}
section,.card{padding:1.2rem;border:1px solid #52637c;border-radius:12px;background:#15243b}
section{margin:1rem}
label,output{display:block;margin:.7rem 0}
button,input,select,textarea{font:inherit;max-width:100%;box-sizing:border-box}
input,select,textarea{background:#0b1525;color:#eef3ff;border:1px solid #8192aa;padding:.5rem}
button{background:#2c527e;color:white;border:1px solid #9bb5d4;border-radius:6px;padding:.55rem .8rem;margin:.3rem}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffd175;outline-offset:2px}
textarea{width:100%;min-height:6rem}
pre,output{white-space:pre-wrap;overflow-wrap:anywhere}
.checkpoint-panel{border:2px solid #65cde7;background:#112c3d}
.checkpoint-detail,.checkpoint-import-detail,.workspace-detail{max-height:24rem;overflow:auto}
.checkpoint-status{padding:1rem;background:#0b1b28}
@media(max-width:900px){#grid{grid-template-columns:1fr}header,footer{padding:1rem}}
</style>
</head>
<body>
<header>
<h1>ThreeCore Wallet — 保存・再読み込み検証</h1>
<p class="notice">模擬データ専用。実ウォレット・外部通信は使用しません。通常画面とは別の保存領域で検証します。表示される履歴はテスト用です。</p>
<button id="prepare-synthetic">検証用の3ウォレットデータを復元入力欄へ</button>
<p id="manual-status" role="status">控えを保存した後、ページを再読み込みして保存内容を確認できます。</p>
</header>
<main id="grid"></main>
<footer>ローカル検証専用。通常の作業画面は <a href="/">こちら</a>。</footer>
<script type="module" src="/test/browser/checkpoint-demo.js"></script>
</body>
</html>
