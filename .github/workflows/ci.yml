name: Read-only wallet regression tests
on:
  push:
    branches: [main, 'validation/provider-discovery-*', 'validation/provider-errors-*', 'validation/browser-validation-*', 'validation/external-dapp-phase16*', 'validation/external-dapp-phase17*', 'validation/external-dapp-phase18*', 'validation/external-dapp-phase19*', 'validation/external-dapp-phase20*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify every tracked development evidence manifest
        run: node scripts/verify-evidence-collection.js . > evidence-verification.json
      - name: Verify the published historical read-only checkpoint
        run: node docs/evidence/2026-10-28-readonly-verification/verify-evidence.mjs > historical-verification.json
      - name: Keep the verification results with this workflow run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-verification-${{ github.sha }}
          path: |
            evidence-verification.json
            historical-verification.json
          if-no-files-found: error
          retention-days: 30
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline mock and read-only regression tests
        run: node --test --test-timeout=60000 --test-concurrency=2 test/*.test.js
      - name: Demo HTTP routes and test fixture isolation
        run: node --test --test-concurrency=2 integration/*server.test.mjs
      - name: Browser harness rejects uncaught exceptions and unhandled rejections
        run: node scripts/test-browser-ui.js --verify-error-detection
      - name: Three consecutive synthetic Wallet UI runs in fresh Chrome profiles
        run: |
          for attempt in 1 2 3; do
            echo "Synthetic browser validation attempt ${attempt}/3"
            npm run test:browser-ui
          done
  token-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: DAT
            ref: 47d8aa9db72e54e49fc9521f9b4022c416a7c6d1
          - repository: EMA-Draft
            ref: 5d36704ec1a5f5fb89febd7f414eee9fe41fd3ac
          - repository: CAWELON-Draft
            ref: 4af9e1db98cac546e498b6f34531ba890cc2e3c0
    steps:
      - uses: actions/checkout@v4
        with:
          path: wallet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FordPerfect2027/${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: token
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: token/package-lock.json
      - name: Install pinned token dependencies
        working-directory: token
        run: npm ci
      - name: Check source portability, empty-data decoding and compile the actual token contract
        working-directory: token
        run: npm run test:source && npm run test:toolchain && npm run compile
      - name: Validate actual token history and malformed log rejection
        working-directory: token
        run: npm run test:read-only && npm run test:history
      - name: Wallet against local EVM on both supported chain IDs
        working-directory: token
        run: node --test ../wallet/integration/token-compatibility.test.mjs
      - name: Reproduce recorded deployed source and initial issuance offline
        if: matrix.repository == 'DAT'
        working-directory: wallet
        run: |
          node docs/evidence/2026-11-02-token-dependency-review/reconstruct-runtime-source.mjs ../token > source-reconstruction.json
          node docs/evidence/2026-11-02-token-dependency-review/verify-dat-mainnet-source-controls.mjs > dat-mainnet-source-controls.json
          node docs/evidence/2026-11-02-token-dependency-review/verify-recorded-mainnet-deployments.mjs ../token > mainnet-deployment-verification.json
          node docs/evidence/2026-11-02-token-dependency-review/verify-recorded-sepolia-deployments.mjs ../token > sepolia-deployment-verification.json
      - name: Keep the source and deployment comparison results
        if: ${{ always() && matrix.repository == 'DAT' }}
        uses: actions/upload-artifact@v4
        with:
          name: deployed-source-verification-${{ github.sha }}
          path: |
            wallet/source-reconstruction.json
            wallet/dat-mainnet-source-controls.json
            wallet/mainnet-deployment-verification.json
            wallet/sepolia-deployment-verification.json
          if-no-files-found: error
          retention-days: 30
