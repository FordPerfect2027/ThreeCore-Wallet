name: Read-only wallet regression tests
on:
  push:
    branches: [main, 'validation/provider-discovery-*', 'validation/provider-errors-*', 'validation/browser-validation-*', 'validation/external-dapp-phase16*', 'validation/external-dapp-phase17*', 'validation/external-dapp-phase18*', 'validation/external-dapp-phase19*', 'validation/external-dapp-phase20*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline mock and read-only regression tests
        run: node --test --test-timeout=60000 --test-concurrency=2 test/*.test.js
      - name: Demo HTTP routes and test fixture isolation
        run: node --test --test-concurrency=2 integration/*server.test.mjs
      - name: Browser harness rejects uncaught exceptions and unhandled rejections
        run: node scripts/test-browser-ui.js --verify-error-detection
      - name: Three consecutive synthetic Wallet UI runs in fresh Chrome profiles
        run: |
          for attempt in 1 2 3; do
            echo "Synthetic browser validation attempt ${attempt}/3"
            npm run test:browser-ui
          done
  token-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: DAT
            ref: e0215f1a32824c19bcc89da96841e758928f4f29
          - repository: EMA-Draft
            ref: 362db49dcc5d5db5560b71ed5acd19bba326575e
          - repository: CAWELON-Draft
            ref: c62f63370f7bcbe559d07b4d757384cf5f43ff0f
    steps:
      - uses: actions/checkout@v4
        with:
          path: wallet
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FordPerfect2027/${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: token
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: token/package-lock.json
      - name: Install pinned token dependencies
        working-directory: token
        run: npm ci
      - name: Compile the actual token contract
        working-directory: token
        run: npm run compile
      - name: Validate actual token history and malformed log rejection
        working-directory: token
        run: npm run test:read-only && npm run test:history
      - name: Wallet against local EVM on both supported chain IDs
        working-directory: token
        run: node --test ../wallet/integration/token-compatibility.test.mjs
